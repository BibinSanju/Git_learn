name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build source artifact
        run: |
          mkdir -p dist
          cp factorial.py test_factorial.py requirements.txt dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: factorial-python
          path: dist/
